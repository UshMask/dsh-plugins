name: Validate marketplace changes

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check plugin code
        run: |
          for file in packages/*/index.js packages/*/client.js; do
            node --check "$file"
          done
      - name: Validate manifests and market index
        run: node scripts/generate-index.mjs --check
